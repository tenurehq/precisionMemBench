services:
  supermemory-server:
    build:
      context: .
      target: binary-runtime
    environment:
      OPENAI_API_KEY: "key"
      OPENAI_BASE_URL: "http://host.docker.internal:8000/api/v1"
      OPENAI_MODEL: "us.anthropic.claude-sonnet-4-6"
      SUPERMEMORY_DATA_DIR: "/data"
      SUPERMEMORY_PORT: "6767"
    volumes:
      - supermemory-data:/data
    expose:
      - "6767"

  supermemory-wrapper:
    build:
      context: .
      target: wrapper-runtime
    depends_on:
      - supermemory-server
    ports:
      - "8080:8080"
    environment:
      SUPERMEMORY_BASE_URL: "http://supermemory-server:6767"
      POLL_TIMEOUT_S: "30"
      SEED_DELAY_MS: "0"
      WRAPPER_PORT: "8080"
    volumes:
      - supermemory-data:/data:ro

volumes:
  supermemory-data:
