services:
  infinity-reranker:
    image: michaelf34/infinity@sha256:11e8b3921b9f1a58965afaad4a844c435c9807cbc82c51e47cb147b7d977fc88
    environment:
      - HF_HUB_DISABLE_XET=1
    ports:
      - "7997:7997"
    command: >
      v2
      --model-id mixedbread-ai/mxbai-rerank-xsmall-v1
      --port 7997
    volumes:
      - infinity_cache:/app/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7997/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s

  gbrain-wrapper:
    image: tenureai/precisionmembench-gbrain:v1.0.1@sha256:a1f47db51812db5f4dfee7ea64982959c2cc44640bfa1703885eb78f9ec071a3
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      infinity-reranker:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

volumes:
  infinity_cache:
